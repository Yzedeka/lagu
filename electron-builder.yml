appId: com.lagu.musicplayer
productName: Lagu
copyright: Copyright (c) 2026 Lagu

directories:
  output: build
  buildResources: build

# The renderer and main process are already bundled by electron-vite, so only
# the built output and manifest are needed (no node_modules at runtime).
files:
  # Keep production dependencies (electron-updater and its tree) so in-app
  # updates work; everything else is bundled already.
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!node_modules/**/{test,tests,__tests__,example,examples,docs}/**'

# Ship the app icon so the main process can set the window icon when packaged.
extraResources:
  - from: src/renderer/src/icons/app_icon.png
    to: app_icon.png

asar: true
compression: normal

# Register as a handler for common audio types so Lagu can be set as the
# default music/audio app and opened with files.
fileAssociations:
  - ext: mp3
    name: MP3 audio
    mimeType: audio/mpeg
  - ext: m4a
    name: M4A audio
    mimeType: audio/mp4
  - ext: aac
    name: AAC audio
    mimeType: audio/aac
  - ext: flac
    name: FLAC audio
    mimeType: audio/flac
  - ext: ogg
    name: Ogg audio
    mimeType: audio/ogg
  - ext: opus
    name: Opus audio
    mimeType: audio/ogg
  - ext: wav
    name: WAV audio
    mimeType: audio/wav
  - ext: wma
    name: WMA audio
    mimeType: audio/x-ms-wma
  - ext: m4b
    name: M4B audiobook
    mimeType: audio/mp4

# Where the app looks for updates (electron-updater "generic" provider).
# Serve latest-linux.yml / latest.yml / latest-mac.yml next to the installers.
# Change this to your site's domain (it is baked into the packaged app).
publish:
  provider: generic
  url: https://lagu.app/downloads

# --- Linux ---------------------------------------------------------------
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
    # Portable tarball - runs without FUSE (handy on distros without libfuse2).
    - target: tar.gz
      arch: [x64]
  category: AudioVideo
  icon: build/icon.png
  syncDesktopName: true
  synopsis: Minimalist local music player
  description: >-
    Lagu is a minimalist desktop music player for your local library, with
    artwork-driven theming, queue management, crossfade and synchronized lyrics.

rpm:
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - libXtst
    - xdg-utils
    - at-spi2-core
    - libuuid
    - libsecret

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

# --- Windows -------------------------------------------------------------
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}

# --- macOS ---------------------------------------------------------------
# A .app bundle (dir target). Signing is disabled for local builds.
mac:
  target:
    - target: dir
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.png
  category: public.app-category.music
  identity: null
  artifactName: ${productName}-${version}-mac.${ext}

# --- Android (.apk) ------------------------------------------------------
# Electron cannot produce an APK. Android support is a separate Capacitor
# shell that reuses the renderer/ folder verbatim; see scripts/build-apk.mjs
# for the placeholder entry point and the plan.
