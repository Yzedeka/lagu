<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lagu - a minimalist desktop music player</title>
    <meta
      name="description"
      content="Lagu is a minimalist, fast desktop music player for your local library. Artwork-driven theming, a real queue, crossfade, 8D audio and synchronized lyrics. Now in beta."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Painted before the stylesheet loads so refreshing never flashes white. -->
    <style>
      html {
        background-color: #0f0f0f;
        color-scheme: dark;
      }
      body {
        margin: 0;
        background-color: #0f0f0f;
        color: #e7e7e7;
      }
    </style>
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="color-scheme" content="dark" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lagu - a minimalist desktop music player" />
    <meta
      property="og:description"
      content="Play your local music with a clean, fast player that takes its colours from your album art. Now in beta."
    />
    <meta property="og:image" content="/favicon.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
